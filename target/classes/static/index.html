<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPD Token System</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; background: #f2f6fa; color: #222; }
  header { background: #0b5ed7; color: #fff; padding: 14px 20px; }
  header h1 { margin: 0 0 10px; font-size: 22px; }
  .tab { background: #ffffff33; color: #fff; border: 0; padding: 8px 16px; border-radius: 4px 4px 0 0; cursor: pointer; margin: 0 4px 0 0; }
  .tab.active { background: #f2f6fa; color: #0b5ed7; font-weight: bold; }
  .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
  .card { background: #fff; border-radius: 8px; padding: 18px; margin-bottom: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  label { display: block; margin: 10px 0 4px; font-weight: bold; }
  input, select, textarea { width: 100%; padding: 8px; border: 1px solid #bbb; border-radius: 4px; }
  button { background: #0b5ed7; color: #fff; border: 0; padding: 9px 16px; border-radius: 4px; cursor: pointer; margin-top: 12px; margin-right: 6px; }
  button.green { background: #198754; }
  button.grey { background: #6c757d; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
  .big { font-size: 64px; font-weight: bold; color: #0b5ed7; margin: 0; }
  .msg { margin-top: 10px; padding: 10px; background: #e7f1ff; border-radius: 4px; }
  .error { background: #f8d7da; }
  .badge { padding: 3px 8px; border-radius: 10px; color: #fff; font-size: 12px; }
  .WAITING { background: #fd7e14; } .IN_CONSULTATION { background: #198754; } .DONE { background: #6c757d; }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .now { font-size: 56px; font-weight: bold; color: #198754; margin: 4px 0; }
  .chip { display: inline-block; background: #fff3cd; border-radius: 12px; padding: 4px 10px; margin: 3px; font-weight: bold; }
  .page { display: none; } .page.active { display: block; }
</style>
</head>
<body>
<header>
  <h1>City Hospital - OPD Token System</h1>
  <button class="tab active" data-t="reg" onclick="show('reg')">Register</button>
  <button class="tab" data-t="board" onclick="show('board')">Live Board</button>
  <button class="tab" data-t="admin" onclick="show('admin')">Admin</button>
</header>

<div class="container">

  <!-- REGISTER PAGE -->
  <div id="reg" class="page active">
    <div class="card">
      <h2>Patient Registration</h2>
      <label>Name</label><input id="name">
      <label>Age</label><input id="age" type="number" min="0">
      <label>Phone</label><input id="phone">
      <label>Symptoms</label><textarea id="symptoms" rows="3"></textarea>
      <button class="grey" onclick="suggest()">Suggest doctor with AI</button>
      <div id="aiBox"></div>
      <label>Doctor</label><select id="doctor"></select>
      <button onclick="register()">Get Token</button>
      <div id="regError"></div>
    </div>
    <div class="card" id="tokenCard" style="display:none">
      <h2>Your Token</h2>
      <p class="big" id="tNumber"></p>
      <p id="tInfo"></p>
    </div>
  </div>

  <!-- LIVE BOARD PAGE -->
  <div id="board" class="page">
    <h2>Live Token Board <small style="font-size:14px;color:#666">(refreshes every 5s)</small></h2>
    <div class="board" id="boardGrid"></div>
  </div>

  <!-- ADMIN PAGE -->
  <div id="admin" class="page">
    <div class="card">
      <h2>Add Doctor</h2>
      <label>Name</label><input id="dName">
      <label>Specialization</label><input id="dSpec" placeholder="e.g. Cardiologist, General Physician">
      <label>Room No</label><input id="dRoom">
      <button onclick="addDoctor()">Add Doctor</button>
    </div>
    <div class="card">
      <h2>Doctors</h2>
      <table><thead><tr><th>Name</th><th>Specialization</th><th>Room</th><th>Available</th><th></th></tr></thead>
        <tbody id="doctorRows"></tbody></table>
    </div>
    <div class="card">
      <h2>Today's Queue</h2>
      <div id="adminError"></div>
      <table><thead><tr><th>Token</th><th>Patient</th><th>Doctor</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="queueRows"></tbody></table>
    </div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  let current = 'reg', myTokenId = null;

  async function api(url, options = {}) {
    const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options });
    if (!res.ok) {
      let msg = 'Request failed';
      try { msg = (await res.json()).message || msg; } catch (e) {}
      throw new Error(msg);
    }
    return res.json();
  }
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function show(tab) {
    current = tab;
    document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === tab));
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.t === tab));
    if (tab === 'reg') loadDoctorSelect();
    if (tab === 'board') refreshBoard();
    if (tab === 'admin') { loadDoctorRows(); loadQueue(); }
  }

  // ---------- Register ----------
  async function loadDoctorSelect() {
    const docs = (await api('/api/doctors')).filter(d => d.available);
    $('doctor').innerHTML = docs.length
      ? docs.map(d => `<option value="${d.id}">${esc(d.name)} (${esc(d.specialization)}) - Room ${esc(d.roomNo)}</option>`).join('')
      : '<option value="">No doctors available</option>';
  }
  async function suggest() {
    $('aiBox').innerHTML = '<div class="msg">Thinking...</div>';
    try {
      const r = await api('/api/ai/suggest', { method: 'POST', body: JSON.stringify({ symptoms: $('symptoms').value }) });
      $('aiBox').innerHTML = `<div class="msg">${esc(r.suggestion)}</div>`;
    } catch (e) { $('aiBox').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
  }
  async function register() {
    $('regError').innerHTML = '';
    try {
      const t = await api('/api/tokens', { method: 'POST', body: JSON.stringify({
        name: $('name').value, age: parseInt($('age').value) || null, phone: $('phone').value,
        symptoms: $('symptoms').value, doctorId: parseInt($('doctor').value) || null }) });
      myTokenId = t.id;
      showToken(t);
    } catch (e) { $('regError').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
  }
  function showToken(t) {
    $('tokenCard').style.display = 'block';
    $('tNumber').textContent = '#' + t.tokenNumber;
    const s = t.status === 'WAITING' ? `Waiting - ${t.aheadOfYou} patient(s) ahead of you`
            : t.status === 'IN_CONSULTATION' ? 'Your turn! Please go in.' : 'Consultation completed';
    $('tInfo').innerHTML = `${esc(t.patientName)} &middot; ${esc(t.doctorName)} &middot; Room ${esc(t.roomNo)}<br><b>${s}</b>`;
  }

  // ---------- Live Board ----------
  async function refreshBoard() {
    try {
      const [docs, tokens] = await Promise.all([api('/api/doctors'), api('/api/tokens/today')]);
      $('boardGrid').innerHTML = docs.filter(d => d.available).map(d => {
        const mine = tokens.filter(t => t.doctorId === d.id);
        const now = mine.find(t => t.status === 'IN_CONSULTATION');
        const waiting = mine.filter(t => t.status === 'WAITING');
        return `<div class="card"><h3>${esc(d.name)}</h3>
          <div>${esc(d.specialization)} &middot; Room ${esc(d.roomNo)}</div>
          <p>Now serving</p><div class="now">${now ? '#' + now.tokenNumber : '-'}</div>
          <p>Waiting (${waiting.length})</p>
          <div>${waiting.length ? waiting.map(t => `<span class="chip">#${t.tokenNumber}</span>`).join('') : 'No one waiting'}</div></div>`;
      }).join('') || '<p>No doctors available.</p>';
    } catch (e) { $('boardGrid').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
  }

  // ---------- Admin ----------
  const adminErr = e => $('adminError').innerHTML = `<div class="msg error">${esc(e.message)}</div>`;
  async function loadDoctorRows() {
    const docs = await api('/api/doctors');
    $('doctorRows').innerHTML = docs.map(d => `<tr>
      <td>${esc(d.name)}</td><td>${esc(d.specialization)}</td><td>${esc(d.roomNo)}</td>
      <td>${d.available ? 'Yes' : 'No'}</td>
      <td><button class="grey" onclick="toggle(${d.id}, ${!d.available})">${d.available ? 'Mark Unavailable' : 'Mark Available'}</button></td></tr>`).join('');
  }
  async function addDoctor() {
    try {
      await api('/api/doctors', { method: 'POST', body: JSON.stringify({
        name: $('dName').value, specialization: $('dSpec').value, roomNo: $('dRoom').value }) });
      ['dName', 'dSpec', 'dRoom'].forEach(i => $(i).value = '');
      loadDoctorRows();
    } catch (e) { adminErr(e); }
  }
  async function toggle(id, value) {
    try { await api(`/api/doctors/${id}/availability?value=${value}`, { method: 'PUT' }); loadDoctorRows(); }
    catch (e) { adminErr(e); }
  }
  async function loadQueue() {
    const tokens = await api('/api/tokens/today');
    $('queueRows').innerHTML = tokens.map(t => `<tr>
      <td>#${t.tokenNumber}</td><td>${esc(t.patientName)}</td><td>${esc(t.doctorName)}</td>
      <td><span class="badge ${t.status}">${t.status.replace('_', ' ')}</span></td>
      <td>${t.status === 'WAITING' ? `<button onclick="setStatus(${t.id}, 'IN_CONSULTATION')">Start</button>` : ''}
          ${t.status === 'IN_CONSULTATION' ? `<button class="green" onclick="setStatus(${t.id}, 'DONE')">Done</button>` : ''}</td></tr>`).join('')
      || '<tr><td colspan="5">No tokens yet today</td></tr>';
  }
  async function setStatus(id, value) {
    $('adminError').innerHTML = '';
    try { await api(`/api/tokens/${id}/status?value=${value}`, { method: 'PUT' }); loadQueue(); }
    catch (e) { adminErr(e); }
  }

  // ---------- Auto refresh every 5s ----------
  setInterval(async () => {
    try {
      if (current === 'board') refreshBoard();
      if (current === 'admin') loadQueue();
      if (current === 'reg' && myTokenId) showToken(await api('/api/tokens/' + myTokenId));
    } catch (e) {}
  }, 5000);

  loadDoctorSelect();
</script>
</body>
</html>
